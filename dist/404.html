<!doctype html>
<html lang="en">    <head>        <meta charset="UTF-8">        <meta name="viewport" content="width=device-width,initial-scale=1.0">        <title>404 — Page Not Found</title>        <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071018;color:#eef7fa;font-family:Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center}.box{text-align:center;max-width:620px;padding:40px}.mark{width:58px;height:58px;margin:0 auto 22px;border-radius:16px;display:grid;place-items:center;background:#22c7d6;color:#061016;font-weight:900;letter-spacing:-1px}.code{font-size:clamp(80px,18vw,150px);line-height:.9;font-weight:900;letter-spacing:-8px;color:#22c7d6}.box h1{font-size:30px;margin:22px 0 10px}.box p{color:#8fa1ad;line-height:1.7;margin:0 auto 28px}.btn{display:inline-block;background:#22c7d6;color:#061016;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800}.hint{margin-top:22px;color:#536875;font-size:13px}        </style>    </head>
